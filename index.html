<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emilio Moda 4.0</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Emilio Moda</h1><p>Moda para toda la familia</p></header><div class="toolbar"><input id="buscar" placeholder="Buscar producto..."><select id="orden"><option value="az">Precio menor primero</option><option value="za">Precio mayor primero</option></select><button id="adminBtn">Admin</button></div><div id="productos" class="grid"></div><dialog id="panel"><h2>Administración</h2><input id="nombre" placeholder="Nombre"><input id="precio" type="number" placeholder="Precio C$"><select id="categoria"><option>Mujer</option><option>Hombre</option><option>Niños</option></select><input type="file" id="foto" accept="image/*"><button onclick="guardarProducto()">Guardar</button><button onclick="exportarJSON()">Exportar JSON</button><input type="file" id="importFile" accept=".json"><button onclick="importarJSON()">Importar JSON</button><button onclick="panel.close()">Cerrar</button></dialog><div id="modalImg" class="modal" onclick="this.style.display='none'"><img id="imgGrande"></div><script src="app.js"></script></body></html>
